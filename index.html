<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能源對對看 - 泡泡消除遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            overflow-x: hidden;
            overflow-y: hidden;
            touch-action: none;
        }
        #gameCanvas {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
            margin: 0 auto;
            border: 4px solid #334155;
            width: 100%;
            height: auto;
            max-height: 80vh; 
            touch-action: none; 
        }
        .hud-panel {
            background-color: #1e293b;
            border: 1px solid #475569;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="w-full h-screen flex flex-col items-center justify-center p-1 md:p-4 relative">

    <div id="topBar" class="w-full max-w-[960px] flex justify-center mb-2 h-[30px]">
        <div id="timerDisplay" class="text-sm md:text-lg font-bold text-white hidden bg-slate-800 px-4 py-1 rounded-full shadow-lg border border-slate-600">
            距離驟死賽: 00:00
        </div>
    </div>

    <div class="flex flex-row w-full max-w-[1100px] justify-center items-start gap-1 sm:gap-2 md:gap-4 relative">
        
        <div class="flex flex-col w-[75px] sm:w-[120px] md:w-[150px] shrink-0 gap-2 mt-8 md:mt-12">
            <div class="hud-panel p-2 rounded-lg text-center flex flex-col items-center justify-center min-h-[60px]">
                <div class="text-[10px] md:text-sm text-slate-400 font-bold mb-1">分數</div>
                <div id="currentScore" class="text-sm sm:text-lg md:text-xl font-bold text-yellow-400">0</div>
            </div>
            <div id="legendLeft" class="flex flex-col gap-1.5 mt-2"></div>
        </div>

        <div class="flex flex-col items-center flex-1 max-w-[480px] shrink">
            <h1 class="text-lg md:text-2xl font-bold text-white mb-1 md:mb-2 text-center tracking-wide">能源對對看</h1>
            
            <div class="relative w-full flex justify-center">
                <canvas id="gameCanvas" width="480" height="720" class="max-w-full h-auto max-h-[75vh] border-4 border-slate-700 bg-slate-800 rounded-xl shadow-2xl touch-none"></canvas>
                
                <div id="gameOverOverlay" class="absolute inset-0 bg-black bg-opacity-90 hidden flex-col items-center justify-center rounded-xl z-10 mx-auto w-full h-full">
                    <h2 id="gameOverTitle" class="text-3xl sm:text-4xl font-bold text-red-400 mb-2">遊戲結束</h2>
                    <p class="text-xl sm:text-2xl text-white mb-4">得分: <span id="finalScore" class="text-yellow-400 font-bold"></span></p>
                    
                    <div class="flex gap-4">
                        <button onclick="window.backToMenu()" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-full font-bold text-sm sm:text-lg shadow-lg">
                            回主選單
                        </button>
                        <button id="retryBtn" onclick="window.resetGame()" class="px-5 py-2 sm:px-6 sm:py-3 bg-blue-600 hover:bg-blue-500 rounded-full font-bold text-sm sm:text-lg shadow-lg transition-transform transform hover:scale-105">
                            再玩一次
                        </button>
                    </div>
                </div>
            </div>

            <p class="text-slate-400 text-[9px] sm:text-[11px] md:text-xs text-center mt-2 leading-tight px-2">
                同組連3格50分, 4格100分。大泡泡需連3種不同小泡泡消除。<br>
                <span id="ruleDesc">單人模式：每30秒大泡泡下擠。</span>
            </p>
        </div>

        <div class="flex flex-col shrink-0 gap-2 mt-8 md:mt-12 w-[80px] sm:w-[130px] md:w-[160px]">
            <div class="hud-panel p-2 rounded-lg flex flex-col items-center justify-center min-h-[60px]">
                <div class="text-[10px] md:text-sm text-slate-400 font-bold mb-1">下一個</div>
                <canvas id="nextBubbleCanvas" width="44" height="44" class="bg-slate-700 rounded-md border border-slate-500 max-w-full"></canvas>
            </div>
            <div id="legendRight" class="flex flex-col gap-1.5 mt-2"></div>
            
            <div id="opponentsPanel" class="hidden flex-col gap-2 mt-2">
                <div class="text-xs font-bold text-slate-400 text-center mb-1 border-b border-slate-600 pb-1">對手</div>
                <div id="opponentsContainer" class="flex flex-col gap-3 w-full items-center max-h-[40vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- 單人遊戲記錄分數 Modal -->
    <div id="nameInputModal" class="absolute inset-0 bg-black bg-opacity-90 hidden flex-col items-center justify-center z-50 p-4">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-600 max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold text-yellow-400 mb-4">結算成績</h2>
            <p class="text-white mb-4">得分: <span id="recordScoreDisplay" class="font-bold text-xl"></span></p>
            <input type="text" id="playerNameInput" placeholder="輸入您的名字" class="w-full p-2 rounded mb-4 text-black text-center font-bold" maxlength="10">
            <button onclick="window.submitSinglePlayerScore()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded font-bold text-white shadow-lg mb-2">上傳成績</button>
            <button onclick="window.backToMenu(); document.getElementById('nameInputModal').classList.add('hidden');" class="w-full py-2 bg-slate-600 hover:bg-slate-500 rounded font-bold text-white">不留紀錄，返回</button>
        </div>
    </div>

    <!-- 全球排行榜 Modal -->
    <div id="globalLeaderboardModal" class="absolute inset-0 bg-slate-900 bg-opacity-95 hidden flex-col items-center justify-center z-50 p-4">
        <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-6 drop-shadow-lg">全球單人排行榜</h2>
        <div class="bg-slate-800 rounded-lg w-full max-w-md p-4 min-h-[300px] border border-slate-600 shadow-xl">
            <ul id="globalLeaderboardList" class="text-white space-y-2 text-sm sm:text-base">
                <li class="text-center text-slate-400">載入中...</li>
            </ul>
        </div>
        <button onclick="document.getElementById('globalLeaderboardModal').classList.add('hidden')" class="mt-6 px-8 py-2 bg-slate-600 hover:bg-slate-500 rounded-full font-bold text-white shadow-lg">關閉</button>
    </div>

    <div id="mainMenuOverlay" class="absolute inset-0 bg-slate-900 bg-opacity-95 z-40 flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-8 drop-shadow-lg">能源對對看</h1>
        
        <div id="connectingMsg" class="text-white text-xl animate-pulse mb-4">連線至伺服器中...</div>

        <div id="menuOptions" class="hidden flex-col gap-4 w-full max-w-xs">
            <button onclick="window.startSinglePlayer()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-lg shadow-lg">單人遊玩</button>
            <button onclick="window.showGlobalLeaderboard()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold text-lg shadow-lg">單人全球排行榜</button>
            <button onclick="window.showCreateRoom()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-lg shadow-lg">創建多人房間</button>
            <button onclick="window.showJoinRoom()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold text-lg shadow-lg">加入多人房間</button>
        </div>

        <div id="createRoomMenu" class="hidden flex-col gap-4 w-full max-w-xs bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-2xl font-bold text-white text-center">創建房間</h2>
            <div>
                <label class="text-sm text-slate-300 mb-1 block">時限 (分鐘): 預設3分鐘</label>
                <input type="number" id="timeLimitInput" value="3" min="1" max="10" class="w-full bg-slate-700 text-white rounded p-2 text-center text-lg">
            </div>
            <button onclick="window.createRoom()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-lg shadow-lg">創建並進入大廳</button>
            <button onclick="window.backToMainMenu()" class="w-full py-2 bg-slate-600 hover:bg-slate-500 rounded-lg font-bold">返回</button>
        </div>

        <div id="joinRoomMenu" class="hidden flex-col gap-4 w-full max-w-xs bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-2xl font-bold text-white text-center">加入房間</h2>
            <div>
                <label class="text-sm text-slate-300 mb-1 block">請輸入房間代碼:</label>
                <input type="text" id="roomCodeInput" maxlength="4" placeholder="例如: ABCD" class="w-full bg-slate-700 text-white rounded p-2 text-center text-2xl uppercase font-mono tracking-widest">
            </div>
            <button onclick="window.joinRoom()" class="w-full py-2 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold text-lg shadow-lg">加入</button>
            <button onclick="window.backToMainMenu()" class="w-full py-2 bg-slate-600 hover:bg-slate-500 rounded-lg font-bold">返回</button>
            <p id="joinErrorMsg" class="text-red-400 text-sm text-center hidden"></p>
        </div>

        <div id="lobbyMenu" class="hidden flex-col gap-4 w-full max-w-sm bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-2xl font-bold text-white text-center">房間大廳</h2>
            <div class="text-center text-slate-300">房間代碼: <span id="lobbyRoomCode" class="text-3xl font-mono text-emerald-400 font-bold tracking-widest block mt-2"></span></div>
            <div class="text-center text-sm text-slate-400 mt-1">時限: <span id="lobbyTimeLimit"></span> 分鐘</div>
            
            <div class="bg-slate-900 rounded-lg p-3 min-h-[150px]">
                <h3 class="text-sm font-bold text-slate-400 border-b border-slate-700 pb-1 mb-2">已加入玩家:</h3>
                <ul id="lobbyPlayerList" class="space-y-1 text-white text-lg"></ul>
            </div>

            <!-- 房主控制: 加入電腦 NPC -->
            <div id="hostControls" class="hidden mt-2 space-y-2 border-t border-slate-600 pt-3">
                <div class="text-sm text-slate-300 mb-1 font-bold text-center">加入電腦 NPC:</div>
                <div class="flex gap-2">
                    <button onclick="window.addNPC('農夫')" class="flex-1 py-1.5 bg-green-700 hover:bg-green-600 rounded text-sm font-bold text-white shadow">農夫 (弱)</button>
                    <button onclick="window.addNPC('豬八戒')" class="flex-1 py-1.5 bg-pink-700 hover:bg-pink-600 rounded text-sm font-bold text-white shadow">豬八戒 (中)</button>
                    <button onclick="window.addNPC('孫悟空')" class="flex-1 py-1.5 bg-orange-700 hover:bg-orange-600 rounded text-sm font-bold text-white shadow">孫悟空 (強)</button>
                </div>
            </div>

            <button id="startGameBtn" onclick="window.startGameMultiplayer()" class="hidden w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-lg shadow-lg animate-bounce mt-4">開始遊戲</button>
            <div id="waitingHostMsg" class="text-amber-400 text-center text-sm font-bold animate-pulse mt-4 hidden">等待房主開始遊戲...</div>
            <button onclick="window.leaveRoom()" class="w-full py-2 bg-red-600 hover:bg-red-500 rounded-lg font-bold mt-2">離開房間</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const appId = 'energy-match-mp';
        const firebaseConfig = {
            apiKey: "AIzaSyChtj8wuN1EQqvp0UN6UXfijnp6evkRHB0",
            authDomain: "energy-match-game.firebaseapp.com",
            projectId: "energy-match-game",
            storageBucket: "energy-match-game.firebasestorage.app",
            messagingSenderId: "622572959981",
            appId: "1:622572959981:web:aab2fbbd539e6f642db4e4"
        };
        
        let app, db, auth;
        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const nextBubbleCanvas = document.getElementById('nextBubbleCanvas');
        const nextCtx = nextBubbleCanvas.getContext('2d');

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;
        const SMALL_R = 22; 
        const BIG_R = 44;   
        const SPEED = 15;
        const BUBBLE_COLOR = '#cbd5e1'; 
        const TEXT_COLOR = '#0f172a';

        const CATEGORIES = [
            { id: 0, name: "太陽能", big: "太陽能", small: ["朝南邊", "矽原料", "晴天", "學校屋頂", "太陽能"] },
            { id: 1, name: "風力能", big: "風力能", small: ["強風", "彰化外海", "齒輪箱", "葉片", "風力能"] },
            { id: 2, name: "水利能", big: "水利能", small: ["明潭發電廠", "高低位差", "水壩", "清理淤泥", "水利能"] },
            { id: 3, name: "生質能", big: "生質能", small: ["焚化廠", "沼氣", "農作物", "廚餘回收", "生質能"] },
            { id: 4, name: "地熱能", big: "地熱能", small: ["冰島", "溫泉附近", "新北金山", "水蒸氣", "地熱能"] }
        ];

        let restingBubbles = [];
        let fallingBubbles = [];
        let activeBubble = null;
        let nextBubble = null;     
        let upcomingBubble = null; 
        let mouseX = WIDTH / 2;
        let mouseY = 0;
        let isGameOver = false;
        let score = 0;
        let ceilingY = 0; 
        let bigBubbleTimer = null; 
        let shakeTimeout = null;   
        let isShaking = false;     
        let animId = null;
        const CANNON_X = WIDTH / 2;
        const CANNON_Y = HEIGHT - 50;

        let isMultiplayer = false;
        let myUserId = null;
        let currentRoomId = null;
        let isHost = false;
        let roomStartTime = 0;
        let roomTimeLimitMinutes = 3;
        let suddenDeathActive = false;
        let opponents = {}; 
        let localNPCs = {}; // 房主專用的 NPC 虛擬環境
        let roomUnsubscribe = null;
        let playersUnsubscribe = null;
        let attacksUnsubscribe = null;
        let lastProcessedAttackTime = 0;
        let npcSuddenDeathTimer = null;

        async function initAuth() {
            if (!auth) {
                document.getElementById('connectingMsg').classList.add('hidden');
                document.getElementById('menuOptions').classList.remove('hidden');
                return;
            }
            try {
                await signInAnonymously(auth);
                myUserId = auth.currentUser.uid;
                document.getElementById('connectingMsg').classList.add('hidden');
                document.getElementById('menuOptions').classList.remove('hidden');
            } catch (err) {
                console.error("Auth failed:", err);
                document.getElementById('connectingMsg').innerText = "連線失敗，僅能單人遊玩";
                setTimeout(() => {
                    document.getElementById('connectingMsg').classList.add('hidden');
                    document.getElementById('menuOptions').classList.remove('hidden');
                }, 2000);
            }
        }
        window.addEventListener('load', initAuth);

        window.backToMainMenu = function() {
            hideAllMenus();
            document.getElementById('menuOptions').classList.remove('hidden');
        }
        function hideAllMenus() {
            ['menuOptions', 'createRoomMenu', 'joinRoomMenu', 'lobbyMenu'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        window.showGlobalLeaderboard = async () => {
            const modal = document.getElementById('globalLeaderboardModal');
            modal.classList.remove('hidden');
            const list = document.getElementById('globalLeaderboardList');
            list.innerHTML = '<li class="text-center text-slate-400">載入中...</li>';
            
            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'single_player_scores');
                const snap = await getDocs(colRef);
                let scores = [];
                snap.forEach(doc => scores.push(doc.data()));
                scores.sort((a, b) => b.score - a.score);
                scores = scores.slice(0, 10);
                
                list.innerHTML = '';
                if(scores.length === 0) {
                    list.innerHTML = '<li class="text-center text-slate-400">目前尚無紀錄，快來挑戰！</li>';
                } else {
                    scores.forEach((s, i) => {
                        let color = i === 0 ? 'text-yellow-400 font-bold text-lg' : (i < 3 ? 'text-amber-300 font-bold' : 'text-slate-300');
                        list.innerHTML += `
                            <li class="flex justify-between items-center bg-slate-700/50 p-2 rounded">
                                <span class="font-bold w-6 ${color}">${i+1}</span>
                                <span class="flex-1 text-left ${color}">${s.name}</span>
                                <span class="${color}">${s.score} 分</span>
                            </li>`;
                    });
                }
            } catch(e) {
                list.innerHTML = '<li class="text-center text-red-400">無法連線到伺服器讀取成績。</li>';
            }
        };

        window.submitSinglePlayerScore = async () => {
            let name = document.getElementById('playerNameInput').value.trim() || '匿名玩家';
            document.getElementById('nameInputModal').classList.add('hidden');
            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'single_player_scores');
                await addDoc(colRef, { name: name, score: score, time: Date.now() });
            } catch(e) {
                console.error("上傳分數失敗", e);
            }
            window.backToMenu();
        };

        window.startSinglePlayer = function() {
            isMultiplayer = false;
            document.getElementById('mainMenuOverlay').classList.add('hidden');
            document.getElementById('opponentsPanel').classList.add('hidden');
            document.getElementById('timerDisplay').classList.add('hidden');
            document.getElementById('ruleDesc').innerText = "單人模式：每30秒大泡泡下擠。";
            initGame();
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 4; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        window.showCreateRoom = () => { hideAllMenus(); document.getElementById('createRoomMenu').classList.remove('hidden'); }
        window.showJoinRoom = () => { hideAllMenus(); document.getElementById('joinRoomMenu').classList.remove('hidden'); document.getElementById('joinErrorMsg').classList.add('hidden'); }
        
        window.createRoom = async () => {
            if (!auth || !myUserId) return;
            const timeLimit = parseInt(document.getElementById('timeLimitInput').value) || 3;
            currentRoomId = generateRoomCode();
            isHost = true;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            await setDoc(roomRef, {
                status: 'waiting',
                timeLimitMinutes: timeLimit,
                host: myUserId,
                createdAt: Date.now()
            });

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'players', myUserId), {
                name: "玩家1 (房主)",
                isGameOver: false,
                restingBubbles: [],
                score: 0
            });
            enterLobby(timeLimit);
        };

        window.joinRoom = async () => {
            if (!auth || !myUserId) return;
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (code.length !== 4) return;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            const roomSnap = await getDoc(roomRef);
            
            if (roomSnap.exists() && roomSnap.data().status === 'waiting') {
                currentRoomId = code;
                isHost = false;
                const timeLimit = roomSnap.data().timeLimitMinutes;
                
                const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'players');
                const playersSnap = await getDocs(playersCol);
                const pCount = playersSnap.size + 1;

                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'players', myUserId), {
                    name: `玩家${pCount}`,
                    isGameOver: false,
                    restingBubbles: [],
                    score: 0
                });
                enterLobby(timeLimit);
            } else {
                const err = document.getElementById('joinErrorMsg');
                err.innerText = "找不到房間或遊戲已開始";
                err.classList.remove('hidden');
            }
        };

        window.addNPC = async (level) => {
            if (!isHost || !currentRoomId) return;
            const uid = 'npc_' + Date.now() + Math.floor(Math.random()*1000);
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'players', uid), {
                name: `電腦(${level})`,
                isNPC: true,
                level: level,
                isGameOver: false,
                restingBubbles: [],
                score: 0
            });
        };

        function enterLobby(timeLimit) {
            hideAllMenus();
            document.getElementById('lobbyMenu').classList.remove('hidden');
            document.getElementById('lobbyRoomCode').innerText = currentRoomId;
            document.getElementById('lobbyTimeLimit').innerText = timeLimit;
            
            if (isHost) {
                document.getElementById('startGameBtn').classList.remove('hidden');
                document.getElementById('waitingHostMsg').classList.add('hidden');
                document.getElementById('hostControls').classList.remove('hidden');
            } else {
                document.getElementById('startGameBtn').classList.add('hidden');
                document.getElementById('waitingHostMsg').classList.remove('hidden');
                document.getElementById('hostControls').classList.add('hidden');
            }

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
            roomUnsubscribe = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (!isHost && data.status === 'playing') {
                        roomStartTime = data.startTime;
                        roomTimeLimitMinutes = data.timeLimitMinutes;
                        launchMultiplayerGame();
                    }
                } else {
                    window.leaveRoom();
                }
            });

            const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'players');
            playersUnsubscribe = onSnapshot(playersCol, (snap) => {
                const list = document.getElementById('lobbyPlayerList');
                list.innerHTML = '';
                opponents = {};
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const uid = docSnap.id;
                    let displayName = data.name;
                    if (uid === myUserId) displayName += ' (你)';

        async function sendAttack(type, count, senderUid) {
            if (!isMultiplayer || !currentRoomId || count <= 0) return;
            const attacksCol = collection(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId, 'attacks');

            for (let targetUid of allParticipants) {

                    try {

        function receiveAttack(type, count) {
            if (isGameOver) return;
            for (let i = 0; i < count; i++) {
                const rx = (Math.random() * (WIDTH - SMALL_R*2)) + SMALL_R;
                const newBubble = generateBubble(rx, type === 'big' ? BIG_R + 2 : SMALL_R + 2, type);
                newBubble.targetX = rx; newBubble.targetY = newBubble.r + 2;
                restingBubbles.push(newBubble);
                pushAndSettleBubbles(restingBubbles, newBubble);
            }
            let floatRes = checkFloatingBubbles(restingBubbles);
            restingBubbles = floatRes.newBubbles;
            checkGameOver();
            syncBoard();
        }

        function receiveAttackForNPC(uid, type, count) {
            let npc = localNPCs[uid];

                const rx = (Math.random() * (WIDTH - SMALL_R*2)) + SMALL_R;

                newBubble.targetX = rx; newBubble.targetY = newBubble.r + 2;

                pushAndSettleBubbles(npc.bubbles, newBubble);
            }
            let floatRes = checkFloatingBubbles(npc.bubbles);
            npc.bubbles = floatRes.newBubbles;
            for (let rb of npc.bubbles) {
                if (rb.y + rb.r >= CANNON_Y - 30) {

        function generateBubble(x, y, type = 'small') {
            const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
            let isBig = (type === 'big');
            let text = isBig ? cat.big : cat.small[Math.floor(Math.random() * cat.small.length)];
            return { x, y, r: isBig ? BIG_R : SMALL_R, categoryId: cat.id, text, isBig, vx: 0, vy: 0, targetX: x, targetY: y };
        }

        function drawBubbleToCtx(targetCtx, b, offsetX = 0, offsetY = 0, isMini = false) {
            const drawX = b.x + offsetX, drawY = b.y + offsetY;
            targetCtx.beginPath(); targetCtx.arc(drawX, drawY, b.r, 0, Math.PI * 2);
            targetCtx.fillStyle = BUBBLE_COLOR; targetCtx.fill();
            
            const gradient = targetCtx.createRadialGradient(drawX - b.r*0.3, drawY - b.r*0.3, b.r*0.1, drawX, drawY, b.r);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)'); gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            targetCtx.fillStyle = gradient; targetCtx.fill();
            targetCtx.lineWidth = 2; targetCtx.strokeStyle = '#94a3b8'; targetCtx.stroke();

            if (!isMini) {
                targetCtx.fillStyle = TEXT_COLOR; targetCtx.textAlign = 'center'; targetCtx.textBaseline = 'middle';
                let fontRatio = (targetCtx === nextCtx) ? 0.7 : 1; 
                if (b.isBig) {
                    targetCtx.font = `bold ${Math.floor(20 * fontRatio)}px Inter, Microsoft JhengHei`; targetCtx.fillText(b.text, drawX, drawY);
                } else {
                    targetCtx.font = `bold ${Math.floor(12 * fontRatio)}px Inter, Microsoft JhengHei`;
                    if (b.text.length > 3) {
                        targetCtx.fillText(b.text.substring(0, 2), drawX, drawY - (7 * fontRatio));
                        targetCtx.fillText(b.text.substring(2), drawX, drawY + (7 * fontRatio));
                    } else { targetCtx.fillText(b.text, drawX, drawY); }
                }
            } else if (b.isBig) {
                targetCtx.fillStyle = 'rgba(255,0,0,0.3)'; targetCtx.beginPath();
                targetCtx.arc(drawX, drawY, b.r*0.8, 0, Math.PI * 2); targetCtx.fill();
            }
        }

        function drawUpcomingBubblePreview() {
            nextCtx.clearRect(0, 0, nextBubbleCanvas.width, nextBubbleCanvas.height);
            if (upcomingBubble) {
                let tempX = upcomingBubble.x, tempY = upcomingBubble.y, tempR = upcomingBubble.r;
                upcomingBubble.x = nextBubbleCanvas.width / 2; upcomingBubble.y = nextBubbleCanvas.height / 2;
                upcomingBubble.r = (nextBubbleCanvas.width / 2) - 4; 
                drawBubbleToCtx(nextCtx, upcomingBubble);
                upcomingBubble.x = tempX; upcomingBubble.y = tempY; upcomingBubble.r = tempR;
            }
        }

        function pushAndSettleBubbles(bubbles, fixedBubble) {
            let moved = true, iterations = 0;
            while (moved && iterations < 300) {
                moved = false; iterations++;
                for (let i = 0; i < bubbles.length; i++) {
                    for (let j = i + 1; j < bubbles.length; j++) {
                        let b1 = bubbles[i], b2 = bubbles[j];
                        let dx = b2.x - b1.x, dy = b2.y - b1.y;
                        let dist = Math.hypot(dx, dy);
                        let minDist = b1.r + b2.r + 1; 
                        
                        if (dist < minDist) {
                            moved = true;
                            let overlap = minDist - dist;
                            if (dist === 0) { dx = 1; dy = 1; dist = Math.SQRT2; }
                            let nx = dx / dist, ny = dy / dist;

                            if (b1 === fixedBubble) { b2.x += nx * overlap; b2.y += ny * overlap; } 
                            else if (b2 === fixedBubble) { b1.x -= nx * overlap; b1.y -= ny * overlap; } 
                            else {
                                b1.x -= nx * overlap * 0.5; b1.y -= ny * overlap * 0.5;
                                b2.x += nx * overlap * 0.5; b2.y += ny * overlap * 0.5;
                            }
                        }
                    }
                }
                for (let b of bubbles) {
                    if (b.x - b.r < 0) b.x = b.r;
                    if (b.x + b.r > WIDTH) b.x = WIDTH - b.r;
                    if (b.y - b.r < 0) b.y = b.r; 
                }
                if (fixedBubble) { fixedBubble.x = fixedBubble.targetX; fixedBubble.y = fixedBubble.targetY; }
            }
        }

        function prepareSpawnBigBubble() {
            if (isGameOver) return;
            isShaking = true;
            shakeTimeout = setTimeout(() => { isShaking = false; spawnBigBubble(); }, 2000);
        }

        function spawnBigBubble() {
            if (isGameOver) return;
            const validXs = [WIDTH / 2 - BIG_R, WIDTH / 2, WIDTH / 2 + BIG_R];
            const rx = validXs[Math.floor(Math.random() * validXs.length)];
            const newBig = generateBubble(rx, BIG_R + 2, 'big');
            newBig.targetX = rx; newBig.targetY = BIG_R + 2;
            restingBubbles.push(newBig);
            pushAndSettleBubbles(restingBubbles, newBig);
            
            let floatRes = checkFloatingBubbles(restingBubbles);
            restingBubbles = floatRes.newBubbles;
            score += floatRes.fallingCount * 100;
            checkGameOver(); syncBoard();
        }

        function generateInitialBoard() {
            let bubbles = [];
            const initialBig = generateBubble(WIDTH / 2, BIG_R + 5, 'big');
            initialBig.targetX = WIDTH / 2; initialBig.targetY = BIG_R + 5;
            bubbles.push(initialBig);
            for (let row = 0; row < 5; row++) {
                const cols = row % 2 === 0 ? 10 : 9;
                const startX = row % 2 === 0 ? SMALL_R + 5 : SMALL_R * 2 + 5;
                const y = SMALL_R + row * (SMALL_R * Math.sqrt(3)); 
                for (let col = 0; col < cols; col++) {
                    const x = startX + col * (SMALL_R * 2 + 2);
                    if (Math.hypot(x - initialBig.x, y - initialBig.y) > initialBig.r - SMALL_R / 2) {
                        bubbles.push(generateBubble(x, y, 'small'));
                    }
                }
            }
            pushAndSettleBubbles(bubbles, initialBig);
            return bubbles;
        }

        function initGame() {
            restingBubbles = generateInitialBoard(); 
            fallingBubbles = []; isGameOver = false; score = 0;
            updateScoreDisplay(); isShaking = false; suddenDeathActive = false;

            initLegend();

            nextBubble = generateBubble(CANNON_X, CANNON_Y, 'small');

            if (!isMultiplayer) bigBubbleTimer = setInterval(prepareSpawnBigBubble, 30000);

            if (animId) cancelAnimationFrame(animId);

        window.initGame = initGame;
        
        window.resetGame = function() {

        function checkCollisions() {
            if (!activeBubble) return;
            if (activeBubble.x - activeBubble.r <= 0) { activeBubble.x = activeBubble.r; activeBubble.vx *= -1; } 
            else if (activeBubble.x + activeBubble.r >= WIDTH) { activeBubble.x = WIDTH - activeBubble.r; activeBubble.vx *= -1; }

            let collided = false;
            if (activeBubble.y - activeBubble.r <= ceilingY) { activeBubble.y = ceilingY + activeBubble.r; collided = true; }
            if (!collided) {
                for (let rb of restingBubbles) {
                    const dist = Math.hypot(activeBubble.x - rb.x, activeBubble.y - rb.y);
                    if (dist < activeBubble.r + rb.r) {
                        const overlap = (activeBubble.r + rb.r) - dist;
                        const dx = activeBubble.x - rb.x, dy = activeBubble.y - rb.y;
                        const normalizeDist = dist === 0 ? 1 : dist;
                        activeBubble.x += (dx / normalizeDist) * overlap; activeBubble.y += (dy / normalizeDist) * overlap;
                        collided = true; break;
                    }
                }
            }

            if (collided) {
                let shouldVanish = false;
                for (let rb of restingBubbles) {
                    if (rb.isBig && rb.categoryId === activeBubble.categoryId && Math.hypot(activeBubble.x - rb.x, activeBubble.y - rb.y) <= activeBubble.r + rb.r + 5) {
                        for (let attached of restingBubbles) {
                            if (!attached.isBig && attached.categoryId === rb.categoryId && attached.text === activeBubble.text && Math.hypot(rb.x - attached.x, rb.y - attached.y) <= rb.r + attached.r + 5) {
                                shouldVanish = true; break;
                            }
                        }
                    }
                    if (shouldVanish) break;
                }

                if (shouldVanish) { activeBubble = null; return; }

                activeBubble.vx = 0; activeBubble.vy = 0; restingBubbles.push(activeBubble);
                const bubbleToCheck = activeBubble; activeBubble = null;
                
                let matchRes = handleMatch(restingBubbles, bubbleToCheck, false, myUserId);
                restingBubbles = matchRes.newBubbles; score += matchRes.score;
                
                let floatRes = checkFloatingBubbles(restingBubbles);
                restingBubbles = floatRes.newBubbles; score += floatRes.fallingCount * 100;
                
                updateScoreDisplay(); checkGameOver(); syncBoard();
            }
        }

        function handleMatch(bubbles, startBubble, isNPC, npcUid) {
            let matchedSmall = [];
            if (!startBubble.isBig) {
                let queue = [startBubble]; let visited = new Set(); visited.add(startBubble);
                while (queue.length > 0) {
                    let curr = queue.shift(); matchedSmall.push(curr);
                    for (let rb of bubbles) {
                        if (!visited.has(rb) && !rb.isBig && rb.categoryId === startBubble.categoryId) {
                            if (Math.hypot(curr.x - rb.x, curr.y - rb.y) <= curr.r + rb.r + 5) { visited.add(rb); queue.push(rb); }
                        }
                    }
                }
            }

            let toRemove = new Set(); let earnedScore = 0;
            if (matchedSmall.length >= 3) {
                earnedScore += 50 * Math.pow(2, matchedSmall.length - 3);
                for (let b of matchedSmall) toRemove.add(b);
                if (isMultiplayer) sendAttack('small', matchedSmall.length - 2, isNPC ? npcUid : myUserId);
            }

            let bigMatchedCount = 0;
            for (let b of bubbles) {
                if (b.isBig) {
                    let attachedTexts = new Set(); let attachedBubbles = [];
                    for (let rb of bubbles) {
                        if (!rb.isBig && rb.categoryId === b.categoryId && Math.hypot(b.x - rb.x, b.y - rb.y) <= b.r + rb.r + 5) {
                            attachedTexts.add(rb.text); attachedBubbles.push(rb);
                        }
                    }
                    if (attachedTexts.size >= 3) {
                        toRemove.add(b); bigMatchedCount++;
                        for (let ab of attachedBubbles) toRemove.add(ab);
                    }
                }
            }

            if (toRemove.size > 0) {
                earnedScore += bigMatchedCount * 200;
                if (isMultiplayer && bigMatchedCount > 0) sendAttack('big', bigMatchedCount, isNPC ? npcUid : myUserId);
                bubbles = bubbles.filter(b => !toRemove.has(b));
            }
            return { newBubbles: bubbles, score: earnedScore };
        }

        function checkFloatingBubbles(bubbles) {
            let connectedToCeiling = new Set(); let queue = [];
            for (let rb of bubbles) { if (rb.y - rb.r <= ceilingY + 5) { connectedToCeiling.add(rb); queue.push(rb); } }
            while (queue.length > 0) {
                let curr = queue.shift();
                for (let rb of bubbles) {
                    if (!connectedToCeiling.has(rb) && Math.hypot(curr.x - rb.x, curr.y - rb.y) <= curr.r + rb.r + 5) {
                        connectedToCeiling.add(rb); queue.push(rb);
                    }
                }
            }
            let newResting = []; let fallingCount = 0;
            for (let rb of bubbles) {
                if (connectedToCeiling.has(rb)) { newResting.push(rb); } 
                else {
                    if (bubbles === restingBubbles) {
                        rb.vx = (Math.random() - 0.5) * 4; rb.vy = 0; fallingBubbles.push(rb);
                    }
                    fallingCount++; 
                }
            }
            return { newBubbles: newResting, fallingCount };
        }

        function checkGameOver() {
            if (isGameOver) return;
            for (let rb of restingBubbles) {
                if (rb.y + rb.r >= CANNON_Y - 30) { showGameOver(false); return; }
            }
        }

        function showGameOver(isWin) {
            isGameOver = true;
            gameOverOverlay.classList.remove('hidden');
            if (bigBubbleTimer) clearInterval(bigBubbleTimer);
            if (shakeTimeout) clearTimeout(shakeTimeout);
            document.getElementById('finalScore').innerText = score;
            
            if (isMultiplayer) {
                document.getElementById('gameOverTitle').innerText = isWin ? "您獲勝了！" : "您被淘汰了";
                document.getElementById('gameOverTitle').className = isWin ? "text-3xl sm:text-4xl font-bold text-emerald-400 mb-2" : "text-3xl sm:text-4xl font-bold text-red-400 mb-2";
                syncBoard();
            } else {
                document.getElementById('gameOverTitle').innerText = "遊戲結束";
                document.getElementById('gameOverTitle').className = "text-3xl sm:text-4xl font-bold text-red-400 mb-2";
                if (score > 0) {
                    document.getElementById('recordScoreDisplay').innerText = score;
                    document.getElementById('nameInputModal').classList.remove('hidden');
                }
            }
        }

        function checkMultiplayerWin() {
            if (!isMultiplayer || isGameOver) return;
            const keys = Object.keys(opponents);
            if (keys.length > 0) {
                let allOthersDead = true;
                for (let k of keys) { if (!opponents[k].isGameOver) { allOthersDead = false; break; } }
                if (allOthersDead) showGameOver(true);
            }
        }

        function npcTurn(uid) {
            let npc = localNPCs[uid];
            if (npc.isGameOver) return;
            
            const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
            let newBubble = generateBubble(WIDTH/2, 0, 'small');
            newBubble.categoryId = cat.id; newBubble.text = cat.small[Math.floor(Math.random() * cat.small.length)];
            
            let errorRate = npc.level === '農夫' ? 0.5 : (npc.level === '豬八戒' ? 0.1 : 0);
            let targetX, targetY;
            
            if (Math.random() >= errorRate) {
                let targets = npc.bubbles.filter(b => b.categoryId === cat.id && !b.isBig);
                if (targets.length > 0) {
                    let t = targets[Math.floor(Math.random() * targets.length)];
                    targetX = t.x + (Math.random() - 0.5) * SMALL_R; targetY = t.y + SMALL_R * 1.5;
                } else { targetX = Math.random() * WIDTH; targetY = HEIGHT / 2; }
            } else { targetX = Math.random() * WIDTH; targetY = HEIGHT / 2; }
            
            newBubble.x = targetX; newBubble.y = targetY; newBubble.targetX = targetX; newBubble.targetY = targetY;
            npc.bubbles.push(newBubble);
            pushAndSettleBubbles(npc.bubbles, newBubble);
            
            let matchRes = handleMatch(npc.bubbles, newBubble, true, uid);
            npc.bubbles = matchRes.newBubbles; npc.score += matchRes.score;
            
            let floatRes = checkFloatingBubbles(npc.bubbles);
            npc.bubbles = floatRes.newBubbles; npc.score += floatRes.fallingCount * 100;
            
            for (let rb of npc.bubbles) {
                if (rb.y + rb.r >= CANNON_Y - 30) { npc.isGameOver = true; clearInterval(npc.intervalId); break; }
            }
            syncNPC(uid);
        }

        function drawTrajectory(angle) {
            let cx = CANNON_X, cy = CANNON_Y, step = 10, currentAngle = angle;
            ctx.beginPath(); ctx.moveTo(cx, cy);
            for (let i = 0; i < 100; i++) {
                let nextX = cx + Math.cos(currentAngle) * step, nextY = cy + Math.sin(currentAngle) * step;
                if (nextX - nextBubble.r <= 0 || nextX + nextBubble.r >= WIDTH) {
                    currentAngle = Math.PI - currentAngle;
                    nextX = cx + Math.cos(currentAngle) * step; nextY = cy + Math.sin(currentAngle) * step;
                }
                if (nextY - nextBubble.r <= ceilingY) break;
                
                let hit = false;
                for (let rb of restingBubbles) { if (Math.hypot(nextX - rb.x, nextY - rb.y) <= nextBubble.r + rb.r) { hit = true; break; } }
                cx = nextX; cy = nextY; ctx.lineTo(cx, cy);
                if (hit) break;
            }
            ctx.setLineDash([10, 10]); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke(); ctx.setLineDash([]); 
        }

        function drawOpponentsMinis() {
            Object.keys(opponents).forEach(uid => {
                const opp = opponents[uid];
                if (!opp.canvas) return;
                const oCtx = opp.canvas.getContext('2d');
                oCtx.clearRect(0, 0, opp.canvas.width, opp.canvas.height);
                const scale = opp.canvas.width / 480;
                oCtx.save(); oCtx.scale(scale, scale);
                if (opp.bubbles) opp.bubbles.forEach(b => drawBubbleToCtx(oCtx, b, 0, 0, true));
                oCtx.restore();

                if (opp.isGameOver) {
                    oCtx.fillStyle = 'rgba(0,0,0,0.6)'; oCtx.fillRect(0, 0, opp.canvas.width, opp.canvas.height);
                    oCtx.fillStyle = 'red'; oCtx.font = 'bold 24px sans-serif'; oCtx.textAlign = 'center'; oCtx.textBaseline = 'middle';
                    oCtx.fillText('淘汰', opp.canvas.width/2, opp.canvas.height/2);
                }
            });
        }

        function gameLoop() {
            if (isMultiplayer && roomStartTime > 0 && !isGameOver) {
                let elapsed = Date.now() - roomStartTime;
                let remaining = (roomTimeLimitMinutes * 60000) - elapsed;
                let timerDisplay = document.getElementById('timerDisplay');
                if (remaining > 0) {
                    let m = Math.floor(remaining / 60000); let s = Math.floor((remaining % 60000) / 1000);
                    timerDisplay.innerText = `距離驟死賽: ${m}:${s.toString().padStart(2, '0')}`;
                } else {
                    timerDisplay.innerText = `驟死賽開始！(每30秒大泡泡)`; timerDisplay.classList.add('text-red-400');
                    if (!suddenDeathActive) {
                        suddenDeathActive = true; prepareSpawnBigBubble();
                        bigBubbleTimer = setInterval(prepareSpawnBigBubble, 30000);
                        if (isHost) {
                            npcSuddenDeathTimer = setInterval(() => { Object.keys(localNPCs).forEach(uid => receiveAttackForNPC(uid, 'big', 1)); }, 30000);
                        }
                    }
                }
                checkMultiplayerWin();
            }
            if (isMultiplayer) drawOpponentsMinis();

            if (!isGameOver || isMultiplayer) { 
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                const dx = mouseX - CANNON_X, dy = mouseY - CANNON_Y;
                let angle = Math.atan2(dy, dx);
                if (angle > -0.1 && angle < Math.PI / 2) angle = -0.1;
                if (angle < Math.PI && angle >= Math.PI / 2) angle = Math.PI + 0.1;

                if (!activeBubble && nextBubble && !isGameOver) drawTrajectory(angle);

                for (let i = fallingBubbles.length - 1; i >= 0; i--) {
                    let fb = fallingBubbles[i]; fb.vy += 0.5; fb.x += fb.vx; fb.y += fb.vy;
                    drawBubbleToCtx(ctx, fb);
                    if (fb.y - fb.r > HEIGHT) fallingBubbles.splice(i, 1);
                }

                if (activeBubble) { activeBubble.x += activeBubble.vx; activeBubble.y += activeBubble.vy; checkCollisions(); }

                for (let rb of restingBubbles) {
                    let ox = 0, oy = 0;
                    if (isShaking) { ox = (Math.random() - 0.5) * 6; oy = (Math.random() - 0.5) * 6; }
                    drawBubbleToCtx(ctx, rb, ox, oy);
                }

                ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(CANNON_X, CANNON_Y + 20, 40, Math.PI, 0); ctx.fill();

                if (activeBubble) drawBubbleToCtx(ctx, activeBubble);
                if (nextBubble && !activeBubble && !isGameOver) {
                    nextBubble.x = CANNON_X; nextBubble.y = CANNON_Y; drawBubbleToCtx(ctx, nextBubble);
                }
            }

            animId = requestAnimationFrame(gameLoop);
        }

        const updatePointerPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX, clientY = e.clientY;
            if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
            else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
            mouseX = (clientX - rect.left) * (canvas.width / rect.width); mouseY = (clientY - rect.top) * (canvas.height / rect.height);
        };

        const fireAction = () => {
            if (isGameOver || activeBubble || !nextBubble) return;
            const dx = mouseX - CANNON_X, dy = mouseY - CANNON_Y;
            let angle = Math.atan2(dy, dx);
            if (angle > -0.1 && angle < Math.PI / 2) angle = -0.1;
            if (angle < Math.PI && angle >= Math.PI / 2) angle = Math.PI + 0.1;
            activeBubble = nextBubble;
            activeBubble.vx = Math.cos(angle) * SPEED; activeBubble.vy = Math.sin(angle) * SPEED;
            nextBubble = upcomingBubble;
            nextBubble.x = CANNON_X; nextBubble.y = CANNON_Y;
            upcomingBubble = generateBubble(CANNON_X, CANNON_Y, 'small');
            drawUpcomingBubblePreview();
        };

        canvas.addEventListener('mousemove', updatePointerPos);
        canvas.addEventListener('click', fireAction);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updatePointerPos(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updatePointerPos(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); fireAction(); }, { passive: false });
    </script>
</body>
